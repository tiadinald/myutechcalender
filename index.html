<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Classes 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff6f8;
    --card: #ffffff;
    --pink: #ff9ec6;
    --pink-deep: #e85d9e;
    --lavender: #c9b6ff;
    --plum: #4a3550;
    --plum-soft: #8a7690;
    --peach: #ffe2cd;
    --mint: #cdf3e2;
    --sky: #cfe6ff;
    --lilac: #ead9ff;
    --blush: #ffd7e8;
    --butter: #fff3c4;
    --line: #f3dee7;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(255,158,198,0.16) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(201,182,255,0.18) 0, transparent 42%);
    font-family: 'Quicksand', sans-serif;
    color: var(--plum);
    padding: 28px 18px 60px;
  }

  .wrap{ max-width: 1280px; margin: 0 auto; }

  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
  }

  .title-block h1{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: clamp(32px, 5vw, 46px);
    color: var(--pink-deep);
    margin:0 0 4px;
    letter-spacing: 0.3px;
  }
  .title-block p{
    margin:0;
    color: var(--plum-soft);
    font-size:15px;
  }
  .today-pill{
    font-family:'Fredoka', sans-serif;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    font-size:14px;
    color: var(--pink-deep);
    box-shadow: 0 6px 18px rgba(232,93,158,0.08);
  }

  .next-class{
    background: linear-gradient(120deg, var(--pink) 0%, var(--lavender) 100%);
    border-radius: 22px;
    padding: 22px 26px;
    color: #fff;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    margin-bottom: 30px;
    box-shadow: 0 14px 30px rgba(232,93,158,0.22);
  }
  .next-class .label{
    font-size:12.5px;
    opacity:0.9;
    margin:0 0 4px;
  }
  .next-class .name{
    font-family:'Fredoka', sans-serif;
    font-size:20px;
    font-weight:600;
    margin:0;
  }
  .next-class .meta{
    font-size:13.5px;
    opacity:0.95;
    margin-top:4px;
  }
  .countdown{
    font-family:'Fredoka', sans-serif;
    font-size:26px;
    font-weight:600;
    background: rgba(255,255,255,0.22);
    padding: 10px 18px;
    border-radius: 16px;
    white-space: nowrap;
  }
  .next-class.live{
    background: linear-gradient(120deg, #ff7fb0 0%, #b98cff 100%);
  }
  .next-class.live .countdown{
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }
  @media (max-width: 1100px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 700px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 460px){
    .grid{ grid-template-columns: 1fr; }
  }

  .day-col{
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    border: 1.5px solid var(--line);
    min-height: 120px;
  }
  .day-col.today{
    border-color: var(--pink);
    box-shadow: 0 10px 26px rgba(255,158,198,0.25);
    position: relative;
  }
  .day-col.today::before{
    content:"today 💕";
    position:absolute;
    top:-12px; right:16px;
    background: var(--pink-deep);
    color:#fff;
    font-family:'Fredoka', sans-serif;
    font-size:11px;
    padding:4px 12px;
    border-radius: 999px;
  }

  .day-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:16px;
    color: var(--plum);
    margin: 2px 0 14px;
  }

  .class-card{
    border-radius: 14px;
    padding: 12px 13px;
    margin-bottom: 10px;
  }
  .class-card:last-child{ margin-bottom:0; }
  .class-card .time{
    font-family:'Fredoka', sans-serif;
    font-size:12.5px;
    font-weight:600;
    color: var(--plum);
    margin-bottom:3px;
  }
  .class-card .module{
    font-size:13px;
    font-weight:700;
    line-height:1.25;
    margin-bottom:2px;
  }
  .class-card .activity{
    font-size:11.5px;
    color: var(--plum-soft);
    margin-bottom:6px;
  }
  .class-card .detail{
    font-size:11px;
    color: var(--plum-soft);
    display:flex;
    gap:6px;
    align-items:center;
  }
  .class-card .detail + .detail{ margin-top:2px; }
  .class-card .zoom-link{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color:#fff;
    background: var(--pink-deep);
    padding:5px 10px;
    border-radius: 999px;
    text-decoration:none;
  }
  .class-card .zoom-link:hover{ background: var(--pink); }
  .class-card .zoom-placeholder{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color: var(--plum-soft);
    background: transparent;
    border: 1.5px dashed var(--plum-soft);
    padding:4px 10px;
    border-radius: 999px;
  }

  .empty-day{
    font-size:13px;
    color: var(--plum-soft);
    padding: 20px 4px;
    text-align:center;
  }

  .c-cmp3011{ background: var(--peach); }
  .c-man3001{ background: var(--mint); }
  .c-cit2004{ background: var(--lilac); }
  .c-cit4001{ background: var(--sky); }
  .c-cit4020{ background: var(--blush); }
  .c-cit4024{ background: var(--butter); }

  footer{
    text-align:center;
    margin-top: 40px;
    font-size:12.5px;
    color: var(--plum-soft);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>my classes 🎀</h1>
      <p>✨ Good Luck Cutie Patootie</p>
    </div>
    <div class="today-pill" id="todayPill">—</div>
  </header>

  <div class="next-class" id="nextClassBanner">
    <div>
      <p class="label">up next</p>
      <p class="name" id="ncName">loading…</p>
      <p class="meta" id="ncMeta"></p>
      <a class="zoom-link" id="ncZoom" href="#" target="_blank" rel="noopener" style="display:none; margin-top:10px;">🔗 Join Zoom</a>
    </div>
    <div class="countdown" id="ncCountdown">--:--</div>
  </div>

  <div class="grid" id="weekGrid"></div>

  <footer>🎀🎀🎀🎀🎀🎀🎀 <code>🎀</code> 🎀 </footer>
</div>

<script>
  // ---------- your schedule lives here ----------
  // day: 1 = Monday ... 6 = Saturday
  const classes = [
    { day: 1, start: "5:00", end: "5:50", module: "MAN3001 - Organisation & Management", activity: "Online Lecture", room: "Online", lecturer: "Dr. Oswy Gayle", cls: "c-man3001", zoom: "https://utech-edu-jm.zoom.us/j/97611565535" },
    { day: 1, start: "7:00", end: "8:50", module: "MAN3001 - Organisation & Management", activity: "Online Tutorial", room: "Online", lecturer: "Dr. Oswy Gayle", cls: "c-man3001", zoom: "https://utech-edu-jm.zoom.us/j/97318517598" },

    { day: 2, start: "6:00", end: "7:50", module: "CIT2004 - Object Oriented Programming", activity: "Online Lecture", room: "Online", lecturer: "Rorron Clarke", cls: "c-cit2004", zoom: "https://utech-edu-jm.zoom.us/w/93546586423?tk=dqdbiEXQVIGIXtujqrV3bOTugAFGTOhrw8o36sn-NlY.DQkAAAAVx8-hNxZhZldPcEl4TVNSLUt6SXE0RGZIR3pBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&pwd=MvqUdLYboJOMhr6hexlwcF2PdnxyOO.1" },
    { day: 2, start: "8:00", end: "8:50", module: "CIT2004 - Object Oriented Programming", activity: "Online Tutorial", room: "Online", lecturer: "Alesia Bowen-Mighty", cls: "c-cit2004", zoom: "https://utech-edu-jm.zoom.us/j/91758057052" },

    { day: 3, start: "10:00", end: "11:50", module: "CIT4001 - Software Implementation", activity: "F2F Tutorial", room: "Room 2B-3", lecturer: "Dwight Thomas", cls: "c-cit4001" },
    { day: 3, start: "5:00", end: "5:50", module: "CIT4020 - Computer Security", activity: "Online Lecture", room: "Online", lecturer: "Kevin B Johnson", cls: "c-cit4020" },
    { day: 3, start: "6:00", end: "9:50", module: "CIT2004 - Object Oriented Programming", activity: "Virtual Lab", room: "Virtual Lab", lecturer: "Alesia Bowen-Mighty", cls: "c-cit2004", zoom: "https://utech-edu-jm.zoom.us/j/91758057052" },

    { day: 4, start: "6:00", end: "6:50", module: "CIT4024 - IT Project Management", activity: "Online Lecture", room: "Online", lecturer: "Derrick Logan", cls: "c-cit4024", zoom: "https://utech-edu-jm.zoom.us/j/98114405630?pwd=By0is9gD1TYBAGAaaIz2asdauipbVz.1" },

    { day: 5, start: "1:00", end: "1:50", module: "CIT4001 - Software Implementation", activity: "Blended Lecture with Online", room: "Online", lecturer: "Dwight Thomas", cls: "c-cit4001" },
    { day: 5, start: "7:00", end: "8:50", module: "CIT4024 - IT Project Management", activity: "Online Tutorial", room: "Online", lecturer: "Charmaine Delisser", cls: "c-cit4024", zoom: "https://utech-edu-jm.zoom.us/j/94869514927?pwd=N4qu8dhKm6bwzbyQouTlU13hC9l8iO.1" },

    { day: 6, start: "11:00", end: "1:50", module: "CIT4020 - Computer Security", activity: "Virtual Lab", room: "Virtual Lab", lecturer: "Prince D V Johnson", cls: "c-cit4020", zoom: "https://meet.google.com/smh-vdsy-zfo"},
    { day: 6, start: "2:00", end: "2:50", module: "CIT4020 - Computer Security", activity: "Online Tutorial", room: "Online", lecturer: "Prince D V Johnson", cls: "c-cit4020", zoom: "https://meet.google.com/smh-vdsy-zfo"},
   ];

  const dayNames = { 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday", 5: "Friday", 6: "Saturday" };

  function toMinutes(t){
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function to12Hour(t){
    let [h, m] = t.split(":").map(Number);
    const period = h >= 12 ? "AM" : "AM";
    h = h % 12;
    if(h === 0) h = 12;
    return `${h}:${String(m).padStart(2, "0")} ${period}`;
  }

  function renderGrid(){
    const grid = document.getElementById("weekGrid");
    grid.innerHTML = "";
    const now = new Date();
    const todayIdx = now.getDay(); // 0 Sun ... 6 Sat

    for(let d = 1; d <= 6; d++){
      const col = document.createElement("div");
      col.className = "day-col" + (d === todayIdx ? " today" : "");

      const dayLabel = document.createElement("div");
      dayLabel.className = "day-name";
      dayLabel.textContent = dayNames[d];
      col.appendChild(dayLabel);

      const dayClasses = classes.filter(c => c.day === d).sort((a,b) => toMinutes(a.start) - toMinutes(b.start));

      if(dayClasses.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-day";
        empty.textContent = "no classes 🌷";
        col.appendChild(empty);
      } else {
        dayClasses.forEach(c => {
          const card = document.createElement("div");
          card.className = "class-card " + c.cls;
          card.innerHTML = `
            <div class="time">${to12Hour(c.start)} – ${to12Hour(c.end)}</div>
            <div class="module">${c.module}</div>
            <div class="activity">${c.activity}</div>
            <div class="detail">📍 ${c.room}</div>
            ${c.lecturer ? `<div class="detail">🧑‍🏫 ${c.lecturer}</div>` : ""}
            ${c.zoom ? `<a class="zoom-link" href="${c.zoom}" target="_blank" rel="noopener">🔗 Join Zoom</a>` : (c.zoom === "" ? `<span class="zoom-placeholder">🔗 add link</span>` : "")}
          `;
          col.appendChild(card);
        });
      }

      grid.appendChild(col);
    }
  }

  function nextOccurrence(c, from){
    const fromDay = from.getDay();
    let diff = (c.day - fromDay + 7) % 7;
    const candidate = new Date(from);
    candidate.setDate(from.getDate() + diff);
    const [sh, sm] = c.start.split(":").map(Number);
    candidate.setHours(sh, sm, 0, 0);
    if(candidate < from){
      candidate.setDate(candidate.getDate() + 7);
    }
    return candidate;
  }

  function findCurrentClass(now){
    const todayIdx = now.getDay();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    return classes.find(c => c.day === todayIdx && nowMin >= toMinutes(c.start) && nowMin < toMinutes(c.end)) || null;
  }

  function updateNextClass(){
    const now = new Date();
    const current = findCurrentClass(now);
    const label = document.querySelector("#nextClassBanner .label");
    const ncZoom = document.getElementById("ncZoom");

    const banner = document.getElementById("nextClassBanner");

    if(current){
      banner.classList.add("live");
      label.textContent = "happening now";
      document.getElementById("ncName").textContent = current.module;
      document.getElementById("ncMeta").textContent =
        `${current.activity} · ${current.room}`;

      if(current.zoom){
        ncZoom.href = current.zoom;
        ncZoom.style.display = "inline-block";
      } else {
        ncZoom.style.display = "none";
      }

      const endToday = new Date(now);
      const [eh, em] = current.end.split(":").map(Number);
      endToday.setHours(eh, em, 0, 0);
      const totalMin = Math.max(0, Math.floor((endToday - now) / 60000));
      const hours = Math.floor(totalMin / 60);
      const mins = totalMin % 60;
      const text = hours > 0 ? `${hours}h ${mins}m left` : `${mins}m left`;
      document.getElementById("ncCountdown").textContent = text;
      return;
    }

    banner.classList.remove("live");
    label.textContent = "up next";
    let soonest = null;
    let soonestClass = null;

    classes.forEach(c => {
      const occ = nextOccurrence(c, now);
      if(!soonest || occ < soonest){
        soonest = occ;
        soonestClass = c;
      }
    });

    if(soonestClass){
      document.getElementById("ncName").textContent = soonestClass.module;
      document.getElementById("ncMeta").textContent =
        `${dayNames[soonestClass.day]} · ${soonestClass.activity} · ${soonestClass.room}`;

      if(soonestClass.zoom){
        ncZoom.href = soonestClass.zoom;
        ncZoom.style.display = "inline-block";
      } else {
        ncZoom.style.display = "none";
      }

      const diffMs = soonest - now;
      const totalMin = Math.floor(diffMs / 60000);
      const days = Math.floor(totalMin / 1440);
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;

      let text;
      if(days > 0) text = `${days}d ${hours}h`;
      else if(hours > 0) text = `${hours}h ${mins}m`;
      else text = `${mins}m`;

      document.getElementById("ncCountdown").textContent = text;
    }
  }

  function updateTodayPill(){
    const now = new Date();
    const opts = { weekday: "long", month: "long", day: "numeric" };
    document.getElementById("todayPill").textContent = now.toLocaleDateString("en-US", opts);
  }

  // ---------- init ----------
  renderGrid();
  updateNextClass();
  updateTodayPill();

  setInterval(updateNextClass, 30000);
</script>
</body>
</html>
